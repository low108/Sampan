<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sampan — 阿嬷的故事</title>
<style>
  :root {
    --ink: #2b2622; --muted: #857a70; --line: #e6ded3;
    --paper: #faf7f2; --card: #fff; --accent: #b4552d; --sea: #3f6b52;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    line-height: 1.65;
  }
  header { padding: 2.5rem 1.5rem 1rem; max-width: 60rem; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.9rem; font-weight: 600; }
  .sub { color: var(--muted); margin: .25rem 0 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 1.75rem; margin: 1.5rem 0 0; }
  .stat b { display: block; font-size: 1.6rem; font-weight: 600; }
  .stat span { color: var(--muted); font-size: .85rem; }
  nav { max-width: 60rem; margin: 1.5rem auto 0; padding: 0 1.5rem;
        border-bottom: 1px solid var(--line); display: flex; gap: .35rem; }
  nav button {
    background: none; border: none; font: inherit; color: var(--muted);
    padding: .6rem 1rem; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem; }
  .card {
    background: var(--card); border-radius: .7rem; padding: 1.25rem 1.4rem;
    margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  .card h3 { margin: 0 0 .35rem; font-size: 1.15rem; }
  .meta { color: var(--muted); font-size: .85rem; display: flex; flex-wrap: wrap; gap: .9rem; }
  .sense {
    margin: .85rem 0 0; padding-left: .9rem; border-left: 3px solid var(--accent);
    font-size: 1.05rem;
  }
  .narrative { margin: .7rem 0 0; color: #4a423b; }
  .gap { margin-top: .8rem; font-size: .85rem; color: var(--muted); }
  .gap b { color: var(--accent); font-weight: 600; }
  .era { color: var(--muted); font-size: .8rem; letter-spacing: .06em;
         text-transform: uppercase; margin: 2rem 0 .6rem; }
  .pin { display: flex; gap: 1rem; align-items: baseline; }
  .pin .dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--sea); flex: none; }
  .pin.provisional .dot { background: none; border: 2px solid var(--muted); }
  .tray { border: 1px dashed var(--line); background: none; }
  .tray h3 { color: var(--muted); }
  .empty { color: var(--muted); padding: 3rem 0; text-align: center; }
  code { background: #f0e9df; padding: .1rem .35rem; border-radius: .25rem; font-size: .85em; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: .9rem 0 .3rem; }
  input, textarea, select {
    width: 100%; font: inherit; padding: .6rem .7rem; border: 1px solid var(--line);
    border-radius: .4rem; background: #fff; color: inherit;
  }
  textarea { min-height: 5rem; resize: vertical; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
  .btn {
    font: inherit; border: none; border-radius: .4rem; padding: .65rem 1.1rem;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
  .btn.rec[data-on="true"] { background: #8b2f2f; }
  .btn:disabled { background: #c9c0b6; cursor: default; }
  .ok { color: var(--sea); font-size: .9rem; }
  .letterbox { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: .7rem; }
  .letterbox summary { cursor: pointer; color: var(--accent); font-size: .9rem; }
  .letter-zh { font-size: 1.08rem; line-height: 1.9; margin: .9rem 0 0; }
  .letter-en { color: #5d554d; margin: .9rem 0 0; }
  /* The journey. No tiles, no API key, nothing to fail on camera. */
  .journey { max-width: 42rem; }
  .stop { display: grid; grid-template-columns: 4rem 2rem 1fr; align-items: start; }
  .stop .year { text-align: right; padding-right: .9rem; color: var(--muted);
                font-variant-numeric: tabular-nums; padding-top: .15rem; }
  .stop .rail { position: relative; height: 100%; min-height: 4.5rem; }
  .stop .rail::before {
    content: ""; position: absolute; left: 50%; top: 1rem; bottom: -.4rem;
    width: 2px; background: var(--line); transform: translateX(-50%);
  }
  .stop:last-child .rail::before { display: none; }
  .stop .node {
    position: absolute; left: 50%; top: .3rem; width: .7rem; height: .7rem;
    border-radius: 50%; background: var(--sea); transform: translateX(-50%);
  }
  .stop.unsure .node { background: var(--paper); border: 2px solid var(--muted); }
  /* The crossing: a gap in the rail, because it was one. */
  .stop.crossing .rail::before {
    background: none;
    border-left: 2px dotted var(--line); left: calc(50% - 1px); width: 0;
  }
  .stop .body { padding: 0 0 1.6rem .6rem; }
  .stop h3 { margin: 0; font-size: 1.05rem; }
  .stop .titles { color: var(--muted); font-size: .85rem; }
  .sea { color: var(--muted); font-size: .8rem; letter-spacing: .3em;
         padding: .2rem 0 .6rem .6rem; }
</style>
</head>
<body>
<header>
  <h1>阿嬷的故事</h1>
  <p class="sub">Collected by 小船 · <span id="sessions">—</span></p>
  <div class="stats" id="stats"></div>
</header>

<nav>
  <button data-view="feed" aria-selected="true">最近 Recent</button>
  <button data-view="timeline" aria-selected="false">一生 Timeline</button>
  <button data-view="map" aria-selected="false">地图 Map</button>
  <button data-view="ask" aria-selected="false">留话 Ask</button>
  <button data-view="fix" aria-selected="false">更正 Fix</button>
</nav>

<main id="main"><p class="empty">Loading…</p></main>

<script>
const key = new URLSearchParams(location.search).get("key") || "";
const narrator = new URLSearchParams(location.search).get("user") || "ah_khim";
const main = document.getElementById("main");

const esc = (s) => (s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const years = (c) =>
  c.year_from && c.year_to && c.year_from !== c.year_to ? `${c.year_from}–${c.year_to}`
  : c.year_from ? `${c.year_from}`
  : c.year_to ? `–${c.year_to}`
  : "";

function storyCard(c) {
  // missing_fields is what the agent will ask her about next time; showing it
  // turns a gap into something the family can watch being filled.
  const gap = c.missing_fields.length
    ? `<p class="gap">还没讲到 · <b>${c.missing_fields.map(esc).join("、")}</b></p>` : "";
  const sense = c.sense_detail
    ? `<p class="sense">${esc(c.sense_detail)}</p>` : "";
  return `<article class="card">
    <h3>${esc(c.title)}</h3>
    <div class="meta">
      ${years(c) ? `<span>${years(c)}</span>` : ""}
      ${c.when_said ? `<span>「${esc(c.when_said)}」</span>` : ""}
      ${c.where_said ? `<span>${esc(c.where_said)}</span>` : ""}
      ${c.people.length ? `<span>${c.people.map(esc).join("、")}</span>` : ""}
    </div>
    ${sense}
    <p class="narrative">${esc(c.narrative)}</p>
    ${letter(c.story_id)}
    ${gap}
  </article>`;
}

let LETTERS = {};

// Bilingual because she speaks Mandarin and her granddaughter does not read
// Chinese. An archive in one language is inherited by people who cannot open it.
function letter(id) {
  const l = LETTERS[id];
  if (!l) return "";
  return `<details class="letterbox">
    <summary>读这封信 Read the letter</summary>
    <p class="letter-zh">${esc(l.chinese)}</p>
    <p class="letter-en"><b>${esc(l.title_en)}</b><br>${esc(l.english)}</p>
  </details>`;
}

function renderStories(stories, grouped) {
  if (!stories.length) return `<p class="empty">还没有故事。</p>`;
  if (!grouped) return stories.map(storyCard).join("");
  let html = "", era = null;
  for (const c of stories) {
    const decade = c.year_from ? `${Math.floor(c.year_from / 10) * 10}s`
                 : c.year_to ? `${Math.floor(c.year_to / 10) * 10}s` : "年份未定 Undated";
    if (decade !== era) { era = decade; html += `<p class="era">${era}</p>`; }
    html += storyCard(c);
  }
  return html;
}

// Her stops in the order she lived them. A geographic projection would put one
// dot in Fujian and four inside 90km of each other in Perak — legible as a
// route, illegible as a map.
function renderJourney(m, stories) {
  const byPlace = {};
  for (const s of stories) if (s.where_said) (byPlace[s.where_said] ||= []).push(s);

  const stops = [...m.pins, ...m.unlocated]
    .map((p) => {
      const at = byPlace[p.place.raw_name] || p.stories || [];
      const yrs = at.map((s) => s.year_from || s.year_to).filter(Boolean);
      return {
        place: p.place,
        stories: at,
        year: yrs.length ? Math.min(...yrs) : null,
        country: p.place.country || "",
      };
    })
    .filter((s) => s.stories.length)
    .sort((a, b) => (a.year ?? 9999) - (b.year ?? 9999));

  // A stop with no year has no place in a route. Putting 阿公坐船南来 at the
  // end of her life because 「二十几年吧」 could not be resolved would be a
  // fabricated order — so undated stops are shown separately, the same way
  // unplaceable ones are.
  const dated = stops.filter((s) => s.year !== null);
  const undated = stops.filter((s) => s.year === null);

  let previousCountry = null;
  const rail = (list) => `<div class="journey">${list.map((s) => {
    const unsure = ["town", "region", "unknown"].includes(s.place.precision);
    // A change of country is the crossing. Mark it once, where it happened.
    const crossed = previousCountry && s.country && s.country !== previousCountry;
    previousCountry = s.country || previousCountry;
    const sea = crossed ? `<p class="sea">～ 南海 ～</p>` : "";
    return `${sea}<div class="stop ${unsure ? "unsure" : ""} ${crossed ? "crossing" : ""}">
      <div class="year">${s.year || "?"}</div>
      <div class="rail"><span class="node"></span></div>
      <div class="body">
        <h3>${esc(s.place.display_name || s.place.raw_name)}</h3>
        <div class="titles">
          ${s.stories.map((x) => esc(x.title)).join(" · ")}
          ${unsure ? " · <em>待确认</em>" : ""}
        </div>
        ${s.place.note ? `<p class="gap">${esc(s.place.note)}</p>` : ""}
      </div>
    </div>`;
  }).join("")}</div>`;

  return `${rail(dated)}
    ${undated.length ? `<p class="era">年份还没讲 · When not yet told</p>
       ${rail(undated)}` : ""}`;
}

function renderMap(m) {
  const pin = (p, provisional) => `<article class="card ${provisional ? "provisional" : ""}">
    <div class="pin ${provisional ? "provisional" : ""}">
      <span class="dot"></span>
      <div>
        <h3>${esc(p.place.display_name || p.place.raw_name)}</h3>
        <div class="meta">
          <span>${esc(p.place.precision)}</span>
          <span>${p.stories.length} 个故事</span>
          ${provisional ? `<span>请家人确认 needs confirming</span>` : ""}
        </div>
        ${p.place.note ? `<p class="gap">${esc(p.place.note)}</p>` : ""}
      </div>
    </div>
  </article>`;

  const sure = m.pins.filter((p) => !["town", "region"].includes(p.place.precision));
  const maybe = m.pins.filter((p) => ["town", "region"].includes(p.place.precision));

  return `<p class="era">每个地方 Every place</p>
    ${sure.map((p) => pin(p, false)).join("")}
    ${maybe.length ? `<p class="era">待确认 To confirm</p>` : ""}
    ${maybe.map((p) => pin(p, true)).join("")}
    ${m.unlocated.length ? `<p class="era">还找不到的地方 Not yet placed</p>` : ""}
    ${m.unlocated.map((p) => `<article class="card tray">
       <h3>${esc(p.place.raw_name)}</h3>
       <div class="meta"><span>${p.stories.length} 个故事</span></div>
       ${p.place.note ? `<p class="gap">${esc(p.place.note)}</p>` : ""}
     </article>`).join("")}`;
}

function renderAsk() {
  return `<article class="card">
    <h3>留一句话给阿嬷</h3>
    <p class="meta"><span>她会先听到你的声音,小船才接着讲。</span></p>
    <label>你是谁</label>
    <div class="row" style="margin-top:0">
      <input id="from" placeholder="伟伦" style="flex:2 1 10rem">
      <input id="rel" placeholder="儿子" style="flex:1 1 6rem">
    </div>
    <label>想问她什么</label>
    <textarea id="q" placeholder="阿公有没有留下什么东西?欣宜问我,我答不出来。"></textarea>
    <label>录一段话(十秒左右)</label>
    <div class="row" style="margin-top:.3rem">
      <button class="btn rec ghost" id="rec" data-on="false">开始录音</button>
      <span class="meta" id="recinfo">还没录</span>
    </div>
    <audio id="preview" controls style="display:none;width:100%;margin-top:.75rem"></audio>
    <div class="row">
      <button class="btn" id="send">送出</button>
      <span class="ok" id="sent"></span>
    </div>
  </article>`;
}

let mediaRecorder, chunks = [], voiceData = null;

function wireAsk() {
  const rec = document.getElementById("rec");
  const info = document.getElementById("recinfo");
  const preview = document.getElementById("preview");

  rec.onclick = async () => {
    if (rec.dataset.on === "true") { mediaRecorder.stop(); return; }
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType });
      const reader = new FileReader();
      reader.onload = () => {
        voiceData = reader.result;
        preview.src = voiceData; preview.style.display = "block";
        info.textContent = `${(blob.size / 1024).toFixed(0)} KB`;
      };
      reader.readAsDataURL(blob);
      rec.dataset.on = "false"; rec.textContent = "重录";
    };
    mediaRecorder.start();
    rec.dataset.on = "true"; rec.textContent = "停止";
    info.textContent = "录音中…";
    // Ten seconds is the intended length, so it stops itself.
    setTimeout(() => { if (rec.dataset.on === "true") mediaRecorder.stop(); }, 10000);
  };

  document.getElementById("send").onclick = async () => {
    const body = {
      from_name: document.getElementById("from").value.trim(),
      relation: document.getElementById("rel").value.trim(),
      question: document.getElementById("q").value.trim(),
      voice_note: voiceData,
    };
    if (!body.from_name || !body.question) {
      document.getElementById("sent").textContent = "名字和问题都要填"; return;
    }
    const res = await fetch(`/api/family/${narrator}/ask`, {
      method: "POST",
      headers: { "X-Sampan-Key": key, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    document.getElementById("sent").textContent =
      res.ok ? "送出了。阿嬷下次接电话就会听到。" : `送不出 (${res.status})`;
  };
}

async function renderFix() {
  const res = await fetch(`/api/family/${narrator}/corrections`,
                          { headers: { "X-Sampan-Key": key } });
  const d = await res.json();
  const card = (e) => `<article class="card">
    <h3>${esc(e.canonical_name)}</h3>
    <div class="meta">
      <span>${esc(e.type)}</span>${e.role ? `<span>${esc(e.role)}</span>` : ""}
      <span>提过 ${e.mention_count} 次</span>
    </div>
    ${e.detail ? `<p class="narrative">${esc(e.detail)}</p>` : ""}
    <div class="row">
      <input data-fix="${esc(e.entity_id)}" placeholder="正确的名字" style="flex:2 1 12rem">
      <button class="btn ghost" data-save="${esc(e.entity_id)}">更正</button>
    </div>
  </article>`;

  const places = (d.places || []).map((p) => `<article class="card">
    <h3>${esc(p.raw_name)}</h3>
    <div class="meta">
      <span>${p.locatable === false || p.precision === "unknown" ? "找不到" : esc(p.precision)}</span>
      <span>${p.stories} 个故事</span>
    </div>
    ${p.note ? `<p class="gap">${esc(p.note)}</p>` : ""}
    <div class="row">
      <input data-place="${esc(p.raw_name)}" placeholder="正确的地方,例如 Sungai Siput, Perak"
             style="flex:2 1 14rem">
      <button class="btn ghost" data-savePlace="${esc(p.raw_name)}">更正</button>
    </div>
  </article>`).join("");

  const dupes = d.possible_duplicates.map((p) => `<article class="card">
    <h3>${esc(p.a.canonical_name)} · ${esc(p.b.canonical_name)}</h3>
    <div class="meta"><span>会不会是同一个人?</span></div>
    <div class="row">
      <button class="btn ghost" data-merge="${esc(p.b.entity_id)}"
              data-into="${esc(p.a.entity_id)}">是同一个人</button>
    </div>
  </article>`).join("");

  return `${places ? `<p class="era">要确认的地方 Places to confirm</p>${places}` : ""}
    ${d.unconfirmed.length ? `<p class="era">还没确认的人 Unconfirmed</p>` : ""}
    ${d.unconfirmed.map(card).join("")}
    ${dupes ? `<p class="era">可能重复 Possible duplicates</p>${dupes}` : ""}
    ${!d.unconfirmed.length && !dupes && !places ? `<p class="empty">没有要更正的。</p>` : ""}`;
}

function wireFix() {
  const post = async (payload) => {
    await fetch(`/api/family/${narrator}/corrections`, {
      method: "POST",
      headers: { "X-Sampan-Key": key, "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    load("fix");
  };
  document.querySelectorAll("[data-save]").forEach((b) => {
    b.onclick = () => {
      const id = b.dataset.save;
      const value = document.querySelector(`[data-fix="${id}"]`).value.trim();
      if (value) post({ kind: "entity_name", target: id, value });
    };
  });
  document.querySelectorAll("[data-savePlace]").forEach((b) => {
    b.onclick = () => {
      const name = b.getAttribute("data-savePlace");
      const value = document.querySelector(`[data-place="${name}"]`).value.trim();
      if (value) post({ kind: "place", target: name, value, by: "family" });
    };
  });
  document.querySelectorAll("[data-merge]").forEach((b) => {
    b.onclick = () => post({
      kind: "merge", target: b.dataset.merge, merge_into: b.dataset.into,
    });
  });
}

async function load(view) {
  main.innerHTML = `<p class="empty">Loading…</p>`;
  if (view === "ask") { main.innerHTML = renderAsk(); wireAsk(); return; }
  if (view === "fix") { main.innerHTML = await renderFix(); wireFix(); return; }
  const res = await fetch(`/api/family/${encodeURIComponent(narrator)}?view=${view}`,
                          { headers: { "X-Sampan-Key": key } });
  if (!res.ok) { main.innerHTML = `<p class="empty">读不到 (${res.status})</p>`; return; }
  const data = await res.json();

  document.getElementById("sessions").textContent = `${data.session_count} 次聊天`;
  const s = data.stats;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${s.stories}</b><span>stories</span></div>
    <div class="stat"><b>${s.years_spanned}</b><span>years spanned</span></div>
    <div class="stat"><b>${s.places}</b><span>places</span></div>
    <div class="stat"><b>${s.people}</b><span>people</span></div>`;

  LETTERS = data.letters || {};
  main.innerHTML = view === "map"
    ? renderJourney(data.map, data.allStories || []) + renderMap(data.map)
    : renderStories(data.stories, view === "timeline");
}

document.querySelectorAll("nav button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("nav button")
      .forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    load(b.dataset.view);
  };
});

load("feed");
</script>
</body>
</html>
