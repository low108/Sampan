<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sampan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9C3B24">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  /* The unplaced bar: absence given a permanent, tappable place on the map. */
  .unplaced-bar {
    position: absolute; left: .8rem; right: .8rem; bottom: .8rem; z-index: 5;
    min-height: 3.4rem; border: none; border-radius: .8rem; cursor: pointer;
    background: rgba(255,252,245,.94); color: var(--ink);
    font-family: var(--sans); font-size: 1.05rem; text-align: left;
    padding: .7rem 1rem; box-shadow: 0 3px 14px rgba(36,30,26,.16);
    backdrop-filter: blur(6px);
  }
  .unplaced-bar .en { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<script src="sampan-map.js"></script>
<script src="app.js"></script>
</body>
</html>
