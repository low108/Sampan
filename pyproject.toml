[project]
name = "sampan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.7.0",
    "google-cloud-firestore>=2.28.1",
    "google-genai>=2.18.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sampan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Integration tests hit the real model: they cost money and vary between runs,
# so they are opt-in via `pytest -m integration`.
addopts = "-q -m 'not integration'"
markers = ["integration: hits the real Gemini API"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
