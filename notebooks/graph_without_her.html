
<!doctype html>
<meta charset="utf-8">
<title>The same graph with her set aside: the communities separate</title>
<body style="margin:0;height:100vh;overflow:hidden;background:#EDE4D6;
             font-family:Georgia,serif;display:flex;flex-direction:column">

  <div style="font:13px Georgia,serif;color:#241E1A;padding:10px 14px 2px;flex:none">
    <b>The same graph with her set aside: the communities separate</b>
    <span style="color:#8A7F76">
      &nbsp;scroll to zoom &middot; drag the background to pan &middot; drag a node
      to move it &middot; hover an edge for what she said &middot; click a node to
      isolate it &middot; double-click to reset
    </span>
  </div>
  <div id="g1e879852-legend" style="font:11px Georgia,serif;padding:4px 14px 6px;
       flex:none"></div>

  <!-- flex:1 gives the graph the rest of the window. user-select:none is what
       makes dragging work at all: without it the browser starts selecting the
       label text as soon as the pointer moves. -->
  <svg id="g1e879852-svg" style="flex:1;width:100%;display:block;
       user-select:none;-webkit-user-select:none;touch-action:none;
       cursor:grab"></svg>

  <div id="g1e879852-tip" style="font:12px Georgia,serif;color:#4A403B;flex:none;
       min-height:3.2em;padding:6px 14px 10px;border-top:1px solid #EADFCC"></div>

<script>
(function () {
  // A <script src> injected through innerHTML does not block, so the drawing
  // code cannot assume d3 exists yet. Load it and draw on the callback.
  function start() {
    if (window.d3 && window.d3.forceSimulation) { draw(); return; }
    const tag = document.createElement("script");
    tag.src = "https://d3js.org/d3.v7.min.js";
    tag.onload = draw;
    tag.onerror = function () {
      document.getElementById("g1e879852-tip").innerHTML =
        "Could not load D3 from its CDN — the graph needs a network connection.";
    };
    document.head.appendChild(tag);
  }

  function draw() {
  const data = {"nodes": [{"id": "ent_mother", "name": "Tan Ah Tai", "detail": "Cooked at the back of the shop. 1922-1998. Passed away. Estate rubber tapper who sacrifice", "degree": 5, "colour": "#2F5D50"}, {"id": "ent_cbf3a1524874", "name": "salted fish fried rice", "detail": "Cooked a few times a week by her mother Mother's recipe made with lots of spring onion.", "degree": 3, "colour": "#2F5D50"}, {"id": "ent_bf68db54940f", "name": "Ah Chwee", "detail": "Childhood friend and neighbour from Sungai Siput who is now old and walks with a stick Cam", "degree": 2, "colour": "#6B3A5C"}, {"id": "ent_sungai_siput", "name": "Sungai Siput", "detail": "Where the rubber estate she grew up on was. The estate no longer exists. The rubber estate", "degree": 2, "colour": "#6B3A5C"}, {"id": "ent_father", "name": "Lim Ah Hock", "detail": "Tapped rubber, later opened the coffee shop on Jalan Bandar, Ipoh. 1918-1981. Passed away.", "degree": 6, "colour": "#9C3B24"}, {"id": "ent_0126209288af", "name": "Ah Gong's shop", "detail": "Coffee shop run by her father, closed in 1969.", "degree": 5, "colour": "#9C3B24"}, {"id": "ent_06a7125cb4e9", "name": "charcoal-toasted bread with butter", "detail": "Bread toasted over charcoal and spread with butter by her father at 5am.", "degree": 2, "colour": "#9C3B24"}, {"id": "ent_husband", "name": "Tan Eng Huat", "detail": "Lorry driver. 1942-2015. Passed away. Lorry driver who frequented the coffee shop and marr", "degree": 2, "colour": "#7A5C2E"}, {"id": "ent_c387e66aa0d1", "name": "upstairs", "detail": "Where she lived after she got married, above the shop.", "degree": 2, "colour": "#7A5C2E"}, {"id": "ent_8927c3b23558", "name": "sewing machine", "detail": "Black Singer sewing machine used by mother at night; currently spoiled but kept.", "degree": 2, "colour": "#2F5D50"}, {"id": "ent_grandfather", "name": "Lim Cheong Hin", "detail": "From Yongchun, Fujian. Landed at Penang in 1928. She never met him. Came from Fujian, Yong", "degree": 2, "colour": "#4A5C7A"}, {"id": "ent_223c81afea20", "name": "Penang", "detail": "Port where grandfather landed by boat from China.", "degree": 2, "colour": "#4A5C7A"}, {"id": "ent_b0951c1f864c", "name": "bread", "detail": "Father toasted it on charcoal and had to throw it away.", "degree": 2, "colour": "#9C3B24"}, {"id": "narrator", "name": "Ah Khim", "detail": "", "degree": 13, "colour": "#241E1A"}], "links": [{"source": "ent_mother", "target": "ent_cbf3a1524874", "statement": "Her mother cooked salted fish fried rice a few times a week.", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "ent_bf68db54940f", "target": "ent_sungai_siput", "statement": "Ah Chwee lives in Sungai Siput.", "quote": "Still there, still in Sungai Siput."}, {"source": "ent_father", "target": "ent_0126209288af", "statement": "Her father owned a coffee shop.", "quote": "Last time my father's shop also sold this."}, {"source": "ent_father", "target": "ent_0126209288af", "statement": "Her father opened and ran a coffee shop at Jalan Bandar in Ipoh.", "quote": "Later he saved a bit of money, nineteen fifty-eight he opened a coffee shop in Ipoh, at Jalan Bandar."}, {"source": "ent_father", "target": "ent_06a7125cb4e9", "statement": "Her father made charcoal-toasted bread with butter at the coffee shop.", "quote": "My father toast the bread, charcoal fire one, spread butter \u2014 that smell\u2026 now you cannot get that kind already."}, {"source": "ent_mother", "target": "ent_0126209288af", "statement": "Her mother worked and cooked at the back of the coffee shop.", "quote": "My mother cook at the back."}, {"source": "ent_husband", "target": "ent_c387e66aa0d1", "statement": "Her husband lived upstairs above the shop at Jalan Bandar for over ten years after marrying.", "quote": "Moved upstairs at Jalan Bandar. Above the shop. We stayed there more than ten years."}, {"source": "ent_mother", "target": "ent_cbf3a1524874", "statement": "Her mother made salted fish fried rice with a lot of spring onion.", "quote": "My mother's salted fish fried rice. She put a lot of spring onion."}, {"source": "ent_mother", "target": "ent_8927c3b23558", "statement": "Her mother owned a black Singer sewing machine used to sew clothes at night.", "quote": "Still there. Singer one, black. Last time at night she sew clothes for people, earn a bit."}, {"source": "ent_grandfather", "target": "ent_223c81afea20", "statement": "Her grandfather travelled by boat from Fujian, Yongchun and landed in Penang.", "quote": "Yes, Fujian, Yongchun. Came by boat, landed at Penang."}, {"source": "ent_father", "target": "ent_b0951c1f864c", "statement": "Her father toasted bread over charcoal at five every morning at the shop.", "quote": "My father still got up at five every day, start the charcoal, toast the bread \u2014 nobody eat."}, {"source": "ent_father", "target": "ent_0126209288af", "statement": "Her father ran and worked at the coffee shop until 1969 when it closed.", "quote": "Sixty-nine, outside was chaotic, nobody dared to go out. Shop open also nobody come."}, {"source": "narrator", "target": "ent_0126209288af", "statement": "she is connected to Ah Gong's shop", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_06a7125cb4e9", "statement": "she is connected to charcoal-toasted bread with butter", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_223c81afea20", "statement": "she is connected to Penang", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_8927c3b23558", "statement": "she is connected to sewing machine", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_b0951c1f864c", "statement": "she is connected to bread", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_bf68db54940f", "statement": "she is connected to Ah Chwee", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_c387e66aa0d1", "statement": "she is connected to upstairs", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_cbf3a1524874", "statement": "she is connected to salted fish fried rice", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_father", "statement": "she is connected to Lim Ah Hock", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_grandfather", "statement": "she is connected to Lim Cheong Hin", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_husband", "statement": "she is connected to Tan Eng Huat", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_mother", "statement": "she is connected to Tan Ah Tai", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "narrator", "target": "ent_sungai_siput", "statement": "she is connected to Sungai Siput", "quote": "My mother cook salted fish fried rice, few times a week."}], "legend": [{"colour": "#9C3B24", "label": "Ah Gong's shop, charcoal-toasted bread with butter, bread\u2026"}, {"colour": "#2F5D50", "label": "sewing machine, salted fish fried rice, Tan Ah Tai"}, {"colour": "#7A5C2E", "label": "upstairs, Tan Eng Huat"}, {"colour": "#4A5C7A", "label": "Penang, Lim Cheong Hin"}, {"colour": "#6B3A5C", "label": "Ah Chwee, Sungai Siput"}, {"colour": "#241E1A", "label": "too connected to group: Ah Khim"}]};
  const root = document.getElementById("g1e879852-svg");
  const tip = document.getElementById("g1e879852-tip");
  const svg = d3.select(root);

  function size() {
    const box = root.getBoundingClientRect();
    return [box.width || 900, box.height || 600];
  }
  let [width, height] = size();

  // Everything is drawn inside this group, so panning and zooming is a single
  // transform on it rather than moving every node.
  const view = svg.append("g");

  const legend = d3.select("#g1e879852-legend");
  data.legend.forEach(function (entry) {
    legend.append("span")
      .style("margin-right", "16px")
      .html('<span style="display:inline-block;width:9px;height:9px;'
            + 'border-radius:9px;background:' + entry.colour
            + ';margin-right:5px"></span>' + entry.label);
  });

  const link = view.append("g").selectAll("line").data(data.links).join("line")
    .attr("stroke", "#C9BCA6").attr("stroke-width", 1.6)
    .on("mouseover", function (event, d) {
      d3.select(this).attr("stroke", "#9C3B24").attr("stroke-width", 3);
      tip.innerHTML = "<b>" + d.statement + "</b><br><i>she said: &ldquo;"
                    + d.quote + "&rdquo;</i>";
    })
    .on("mouseout", function () {
      d3.select(this).attr("stroke", "#C9BCA6").attr("stroke-width", 1.6);
    });

  const node = view.append("g").selectAll("circle").data(data.nodes).join("circle")
    .attr("r", function (d) { return 6 + Math.min(d.degree, 8) * 1.7; })
    .attr("fill", function (d) { return d.colour; })
    .attr("stroke", "#FFFCF5").attr("stroke-width", 2)
    .style("cursor", "pointer")
    .on("mouseover", function (event, d) {
      tip.innerHTML = "<b>" + d.name + "</b> &mdash; " + d.degree
                    + " connection(s)" + (d.detail ? "<br>" + d.detail : "");
    })
    .on("click", function (event, d) {
      event.stopPropagation();
      const near = new Set([d.id]);
      data.links.forEach(function (l) {
        const a = l.source.id || l.source, b = l.target.id || l.target;
        if (a === d.id) near.add(b);
        if (b === d.id) near.add(a);
      });
      node.attr("opacity", function (n) { return near.has(n.id) ? 1 : 0.12; });
      label.attr("opacity", function (n) { return near.has(n.id) ? 1 : 0.12; });
      link.attr("opacity", function (l) {
        const a = l.source.id || l.source, b = l.target.id || l.target;
        return (a === d.id || b === d.id) ? 1 : 0.06;
      });
    })
    .call(d3.drag()
      .on("start", function (event, d) {
        if (!event.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
        root.style.cursor = "grabbing";
      })
      .on("drag", function (event, d) { d.fx = event.x; d.fy = event.y; })
      .on("end", function (event, d) {
        if (!event.active) sim.alphaTarget(0);
        // fx/fy are left set on purpose, so a node stays where it was put.
        root.style.cursor = "grab";
      }));

  const label = view.append("g").selectAll("text").data(data.nodes).join("text")
    .text(function (d) { return d.name; })
    .attr("font-family", "Georgia, serif").attr("font-size", 11)
    .attr("fill", "#241E1A").attr("text-anchor", "middle").attr("dy", -13)
    .style("pointer-events", "none");

  // Pan and zoom the whole canvas. d3.drag on the nodes stops propagation, so
  // dragging a node never pans the background by accident.
  const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", function (event) {
    view.attr("transform", event.transform);
  });
  svg.call(zoom).on("dblclick.zoom", null);

  svg.on("dblclick", function () {
    data.nodes.forEach(function (n) { n.fx = null; n.fy = null; });
    node.attr("opacity", 1); label.attr("opacity", 1); link.attr("opacity", 1);
    tip.innerHTML = "";
    svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
    sim.alpha(0.6).restart();
  });

  const sim = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.links).id(function (d) { return d.id; })
                     .distance(110).strength(0.45))
    .force("charge", d3.forceManyBody().strength(-520))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide().radius(38))
    .on("tick", function () {
      link.attr("x1", function (d) { return d.source.x; })
          .attr("y1", function (d) { return d.source.y; })
          .attr("x2", function (d) { return d.target.x; })
          .attr("y2", function (d) { return d.target.y; });
      node.attr("cx", function (d) { return d.x; })
          .attr("cy", function (d) { return d.y; });
      label.attr("x", function (d) { return d.x; })
           .attr("y", function (d) { return d.y; });
    });

  window.addEventListener("resize", function () {
    const next = size();
    width = next[0]; height = next[1];
    sim.force("center", d3.forceCenter(width / 2, height / 2));
    sim.alpha(0.3).restart();
  });
  }

  start();
})();
</script>
