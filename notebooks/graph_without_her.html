
<!doctype html>
<meta charset="utf-8">
<title>The same graph with her set aside: the communities separate</title>
<body style="margin:0;background:#EDE4D6;font-family:Georgia,serif">
<div id="g6b85852f" style="background:#EDE4D6;border-radius:10px;padding:6px 10px 10px">
  <div style="font:13px Georgia,serif;color:#241E1A;padding:6px 2px 4px">
    <b>The same graph with her set aside: the communities separate</b>
    <span style="color:#8A7F76">
      &nbsp;drag to move &middot; hover an edge for what she said &middot; click a
      node to isolate it &middot; double-click to reset
    </span>
  </div>
  <div id="g6b85852f-legend" style="font:11px Georgia,serif;padding:2px 2px 6px"></div>
  <!-- user-select:none is what makes dragging work. Without it the browser
       starts selecting the label text the moment the pointer moves, the node
       never follows the cursor, and the graph fills up with blue highlight.
       touch-action:none does the same job for a trackpad or a touchscreen. -->
  <svg id="g6b85852f-svg" width="820" height="520"
       style="max-width:100%;user-select:none;-webkit-user-select:none;
              touch-action:none;cursor:grab"></svg>
  <div id="g6b85852f-tip" style="font:12px Georgia,serif;color:#4A403B;
       min-height:2.6em;padding:4px 2px"></div>
</div>
<script>
(function () {
  // A <script src> injected through innerHTML does not block, so the drawing
  // code below cannot assume d3 exists yet -- it runs first and dies silently,
  // leaving an empty panel. Load it explicitly and draw on the callback.
  function start() {
    if (window.d3 && window.d3.forceSimulation) { draw(); return; }
    const existing = document.getElementById("d3-v7-loader");
    if (existing) { existing.addEventListener("load", draw); return; }
    const tag = document.createElement("script");
    tag.id = "d3-v7-loader";
    tag.src = "https://d3js.org/d3.v7.min.js";
    tag.onload = draw;
    tag.onerror = function () {
      document.getElementById("g6b85852f-tip").innerHTML =
        "Could not load D3 from its CDN — the graph needs a network connection.";
    };
    document.head.appendChild(tag);
  }

  function draw() {
  const data = {"nodes": [{"id": "ent_father", "name": "Lim Ah Hock", "detail": "Tapped rubber, later opened the coffee shop on Jalan Bandar, Ipoh. 1918-1981. Passed away.", "degree": 6, "colour": "#9C3B24"}, {"id": "ent_5301980c3e56", "name": "Ah Gong's shop", "detail": "Father's coffee shop downstairs that closed in 1969.", "degree": 5, "colour": "#9C3B24"}, {"id": "ent_mother", "name": "Tan Ah Tai", "detail": "Cooked at the back of the shop. 1922-1998. Passed away. Tapped rubber before daybreak in t", "degree": 5, "colour": "#2F5D50"}, {"id": "ent_a41f4bde91e4", "name": "salted fish fried rice", "detail": "Cooked by her mother a few times a week Mother's recipe made with lots of spring onion.", "degree": 3, "colour": "#2F5D50"}, {"id": "ent_7d0249063bbc", "name": "Ah Chwee", "detail": "Childhood neighbor in Sungai Siput who fell into the river; still lives there and now walk", "degree": 2, "colour": "#6B3A5C"}, {"id": "ent_sungai_siput", "name": "Sungai Siput", "detail": "Where the rubber estate she grew up on was. The estate no longer exists. Rubber estate are", "degree": 2, "colour": "#6B3A5C"}, {"id": "ent_7a2bf7fe9355", "name": "bread", "detail": "Toasted on charcoal by her father every morning even when no customers came.", "degree": 3, "colour": "#9C3B24"}, {"id": "ent_husband", "name": "Tan Eng Huat", "detail": "Lorry driver. 1942-2015. Passed away. Lorry driver customer who married her in 1968 after ", "degree": 2, "colour": "#7A5C2E"}, {"id": "ent_bb29ebfad9ac", "name": "Jalan Bandar", "detail": "Street in Ipoh where her father had his coffee shop and where she lived upstairs after mar", "degree": 2, "colour": "#7A5C2E"}, {"id": "ent_a13d1f3eb6b6", "name": "sewing machine", "detail": "Black Singer machine used by mother; currently spoiled but kept.", "degree": 2, "colour": "#2F5D50"}, {"id": "ent_grandfather", "name": "Lim Cheong Hin", "detail": "From Yongchun, Fujian. Landed at Penang in 1928. She never met him. Came from Fujian, Yong", "degree": 2, "colour": "#4A5C7A"}, {"id": "ent_7a1c0d999c61", "name": "Penang", "detail": "Where her grandfather landed after travelling by boat.", "degree": 2, "colour": "#4A5C7A"}, {"id": "narrator", "name": "Ah Khim", "detail": "", "degree": 12, "colour": "#241E1A"}], "links": [{"source": "ent_father", "target": "ent_5301980c3e56", "statement": "Her father owned a coffee shop.", "quote": "Last time my father's shop also sold this."}, {"source": "ent_mother", "target": "ent_a41f4bde91e4", "statement": "Her mother cooked salted fish fried rice a few times a week.", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "ent_7d0249063bbc", "target": "ent_sungai_siput", "statement": "Ah Chwee lives in Sungai Siput.", "quote": "Still there, still in Sungai Siput."}, {"source": "ent_father", "target": "ent_5301980c3e56", "statement": "Her father opened and owned a coffee shop at Jalan Bandar in Ipoh.", "quote": "Later he saved a bit of money, nineteen fifty-eight he opened a coffee shop in Ipoh, at Jalan Bandar."}, {"source": "ent_father", "target": "ent_7a2bf7fe9355", "statement": "Her father toasted bread over charcoal fire at the coffee shop.", "quote": "My father toast the bread, charcoal fire one, spread butter \u2014 that smell\u2026 now you cannot get that kind already."}, {"source": "ent_mother", "target": "ent_5301980c3e56", "statement": "Her mother cooked at the back of the coffee shop.", "quote": "My mother cook at the back."}, {"source": "ent_husband", "target": "ent_bb29ebfad9ac", "statement": "Her husband lived upstairs above the shop at Jalan Bandar for more than ten years after marrying.", "quote": "Moved upstairs at Jalan Bandar. Above the shop. We stayed there more than ten years."}, {"source": "ent_mother", "target": "ent_a41f4bde91e4", "statement": "Her mother cooked salted fish fried rice with spring onion.", "quote": "My mother's salted fish fried rice. She put a lot of spring onion."}, {"source": "ent_mother", "target": "ent_a13d1f3eb6b6", "statement": "Her mother owned a black Singer sewing machine that she used to sew clothes for people at night.", "quote": "Singer one, black. Last time at night she sew clothes for people, earn a bit."}, {"source": "ent_grandfather", "target": "ent_7a1c0d999c61", "statement": "Her grandfather came by boat from Yongchun, Fujian and landed at Penang.", "quote": "Came by boat, landed at Penang."}, {"source": "ent_father", "target": "ent_5301980c3e56", "statement": "Her father ran and worked at his coffee shop until it closed in 1969.", "quote": "Sixty-nine, outside was chaotic, nobody dared to go out. Shop open also nobody come."}, {"source": "ent_father", "target": "ent_7a2bf7fe9355", "statement": "Her father toasted bread over charcoal early every morning at the shop.", "quote": "My father still got up at five every day, start the charcoal, toast the bread \u2014 nobody eat."}, {"source": "narrator", "target": "ent_5301980c3e56", "statement": "she is connected to Ah Gong's shop", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_7a1c0d999c61", "statement": "she is connected to Penang", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_7a2bf7fe9355", "statement": "she is connected to bread", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_7d0249063bbc", "statement": "she is connected to Ah Chwee", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_a13d1f3eb6b6", "statement": "she is connected to sewing machine", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_a41f4bde91e4", "statement": "she is connected to salted fish fried rice", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_bb29ebfad9ac", "statement": "she is connected to Jalan Bandar", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_father", "statement": "she is connected to Lim Ah Hock", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_grandfather", "statement": "she is connected to Lim Cheong Hin", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_husband", "statement": "she is connected to Tan Eng Huat", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_mother", "statement": "she is connected to Tan Ah Tai", "quote": "Last time my father's shop also sold this."}, {"source": "narrator", "target": "ent_sungai_siput", "statement": "she is connected to Sungai Siput", "quote": "Last time my father's shop also sold this."}], "legend": [{"colour": "#9C3B24", "label": "Ah Gong's shop, bread, Lim Ah Hock"}, {"colour": "#2F5D50", "label": "sewing machine, salted fish fried rice, Tan Ah Tai"}, {"colour": "#7A5C2E", "label": "Jalan Bandar, Tan Eng Huat"}, {"colour": "#4A5C7A", "label": "Penang, Lim Cheong Hin"}, {"colour": "#6B3A5C", "label": "Ah Chwee, Sungai Siput"}, {"colour": "#241E1A", "label": "too connected to group: Ah Khim"}]};
  const root = document.getElementById("g6b85852f-svg");
  const tip = document.getElementById("g6b85852f-tip");
  const width = root.clientWidth || 820, height = 520;
  const svg = d3.select(root).attr("viewBox", [0, 0, width, height]);
  svg.selectAll("*").remove();

  const legend = d3.select("#g6b85852f-legend");
  data.legend.forEach(function (entry) {
    legend.append("span")
      .style("margin-right", "14px")
      .html('<span style="display:inline-block;width:9px;height:9px;border-radius:9px;'
            + 'background:' + entry.colour + ';margin-right:5px">'
            + '</span>' + entry.label);
  });

  const link = svg.append("g").selectAll("line").data(data.links).join("line")
    .attr("stroke", "#C9BCA6").attr("stroke-width", 1.6)
    .on("mouseover", function (event, d) {
      d3.select(this).attr("stroke", "#9C3B24").attr("stroke-width", 3);
      tip.innerHTML = "<b>" + d.statement + "</b><br><i>she said: &ldquo;"
                    + d.quote + "&rdquo;</i>";
    })
    .on("mouseout", function () {
      d3.select(this).attr("stroke", "#C9BCA6").attr("stroke-width", 1.6);
    });

  const node = svg.append("g").selectAll("circle").data(data.nodes).join("circle")
    .attr("r", function (d) { return 5 + Math.min(d.degree, 8) * 1.6; })
    .attr("fill", function (d) { return d.colour; })
    .attr("stroke", "#FFFCF5").attr("stroke-width", 2)
    .style("cursor", "pointer")
    .on("mouseover", function (event, d) {
      tip.innerHTML = "<b>" + d.name + "</b> &mdash; " + d.degree
                    + " connection(s)" + (d.detail ? "<br>" + d.detail : "");
    })
    .on("click", function (event, d) {
      const near = new Set([d.id]);
      data.links.forEach(function (l) {
        const a = l.source.id || l.source, b = l.target.id || l.target;
        if (a === d.id) near.add(b);
        if (b === d.id) near.add(a);
      });
      node.attr("opacity", function (n) { return near.has(n.id) ? 1 : 0.15; });
      label.attr("opacity", function (n) { return near.has(n.id) ? 1 : 0.15; });
      link.attr("opacity", function (l) {
        const a = l.source.id || l.source, b = l.target.id || l.target;
        return (a === d.id || b === d.id) ? 1 : 0.08;
      });
    })
    .call(d3.drag()
      .on("start", function (event, d) {
        if (!event.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
        root.style.cursor = "grabbing";
      })
      .on("drag", function (event, d) { d.fx = event.x; d.fy = event.y; })
      .on("end", function (event, d) {
        if (!event.active) sim.alphaTarget(0);
        // fx/fy are deliberately left set, so a node stays where it was put.
        // Releasing them here is the D3 default and makes the node spring back,
        // which reads as the drag not having worked at all.
        root.style.cursor = "grab";
      }));

  const label = svg.append("g").selectAll("text").data(data.nodes).join("text")
    .text(function (d) { return d.name; })
    .attr("font-family", "Georgia, serif").attr("font-size", 10.5)
    .attr("fill", "#241E1A").attr("text-anchor", "middle").attr("dy", -11)
    .style("pointer-events", "none");

  // Double-click anywhere: unpin every node, undo any isolation, start again.
  svg.on("dblclick", function () {
    data.nodes.forEach(function (n) { n.fx = null; n.fy = null; });
    node.attr("opacity", 1); label.attr("opacity", 1); link.attr("opacity", 1);
    tip.innerHTML = "";
    sim.alpha(0.6).restart();
  });

  const sim = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.links).id(function (d) { return d.id; })
                     .distance(95).strength(0.45))
    .force("charge", d3.forceManyBody().strength(-430))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide().radius(34))
    .on("tick", function () {
      link.attr("x1", function (d) { return d.source.x; })
          .attr("y1", function (d) { return d.source.y; })
          .attr("x2", function (d) { return d.target.x; })
          .attr("y2", function (d) { return d.target.y; });
      node.attr("cx", function (d) { return d.x; })
          .attr("cy", function (d) { return d.y; });
      label.attr("x", function (d) { return d.x; })
           .attr("y", function (d) { return d.y; });
    });
  }

  start();
})();
</script>
