
<!doctype html>
<meta charset="utf-8">
<title>Her memory graph: entities joined by facts, coloured by community</title>
<body style="margin:0;background:#EDE4D6;font-family:Georgia,serif">
<div id="g18be29b0" style="background:#EDE4D6;border-radius:10px;padding:6px 10px 10px">
  <div style="font:13px Georgia,serif;color:#241E1A;padding:6px 2px 4px">
    <b>Her memory graph: entities joined by facts, coloured by community</b>
    <span style="color:#8A7F76">
      &nbsp;drag to move &middot; hover an edge for what she said &middot; click a
      node to isolate it
    </span>
  </div>
  <div id="g18be29b0-legend" style="font:11px Georgia,serif;padding:2px 2px 6px"></div>
  <svg id="g18be29b0-svg" width="820" height="520" style="max-width:100%"></svg>
  <div id="g18be29b0-tip" style="font:12px Georgia,serif;color:#4A403B;
       min-height:2.6em;padding:4px 2px"></div>
</div>
<script>
(function () {
  // A <script src> injected through innerHTML does not block, so the drawing
  // code below cannot assume d3 exists yet -- it runs first and dies silently,
  // leaving an empty panel. Load it explicitly and draw on the callback.
  function start() {
    if (window.d3 && window.d3.forceSimulation) { draw(); return; }
    const existing = document.getElementById("d3-v7-loader");
    if (existing) { existing.addEventListener("load", draw); return; }
    const tag = document.createElement("script");
    tag.id = "d3-v7-loader";
    tag.src = "https://d3js.org/d3.v7.min.js";
    tag.onload = draw;
    tag.onerror = function () {
      document.getElementById("g18be29b0-tip").innerHTML =
        "Could not load D3 from its CDN — the graph needs a network connection.";
    };
    document.head.appendChild(tag);
  }

  function draw() {
  const data = {"nodes": [{"id": "ent_father", "name": "Lim Ah Hock", "detail": "Tapped rubber, later opened the coffee shop on Jalan Bandar, Ipoh. 1918-1981. Passed away.", "degree": 4, "colour": "#9C3B24"}, {"id": "ent_bb10decc7f23", "name": "father's coffee shop", "detail": "Where her father made toast and coffee, closed in 1969 due to chaotic times.", "degree": 3, "colour": "#9C3B24"}, {"id": "ent_724ab7832635", "name": "Ah Chwee", "detail": "Childhood neighbour in the line house; fell into the river; still lives in Sungai Siput an", "degree": 2, "colour": "#4A5C7A"}, {"id": "ent_083e2ee20ddb", "name": "line house", "detail": "Long row of single rooms with mud floors and wood plank walls in the rubber estate.", "degree": 1, "colour": "#4A5C7A"}, {"id": "ent_mother", "name": "Tan Ah Tai", "detail": "Cooked at the back of the shop. 1922-1998. Passed away. Tapped rubber before dawn and went", "degree": 3, "colour": "#9C3B24"}, {"id": "ent_ed2c08a37f39", "name": "salted fish fried rice", "detail": "Cooked by her mother a few times a week in the line house. Mother's dish made with lots of", "degree": 2, "colour": "#9C3B24"}, {"id": "ent_sungai_siput", "name": "Sungai Siput", "detail": "Where the rubber estate she grew up on was. The estate no longer exists. Town and rubber e", "degree": 1, "colour": "#4A5C7A"}, {"id": "ent_97e177fdd6c1", "name": "bread toasted on charcoal fire", "detail": "Toasted with charcoal fire and spread with butter by her father", "degree": 2, "colour": "#9C3B24"}, {"id": "ent_husband", "name": "Tan Eng Huat", "detail": "Lorry driver. 1942-2015. Passed away. Lorry driver who came daily to the shop and sat unti", "degree": 1, "colour": "#2F5D50"}, {"id": "ent_c58ceebd0afd", "name": "upstairs", "detail": "Where she stayed after marriage, above the shop.", "degree": 1, "colour": "#2F5D50"}, {"id": "ent_grandfather", "name": "Lim Cheong Hin", "detail": "From Yongchun, Fujian. Landed at Penang in 1928. She never met him. Came from Yongchun, Fu", "degree": 2, "colour": "#7A5C2E"}, {"id": "ent_74919e81d0c7", "name": "Fujian, Yongchun", "detail": "Origin place in China where grandfather came from.", "degree": 1, "colour": "#7A5C2E"}, {"id": "ent_77948984689a", "name": "Penang", "detail": "Where her grandfather landed after coming by boat.", "degree": 1, "colour": "#7A5C2E"}], "links": [{"source": "ent_father", "target": "ent_bb10decc7f23", "statement": "Her father owned a coffee shop.", "quote": "Yes lah, coffee shop."}, {"source": "ent_724ab7832635", "target": "ent_083e2ee20ddb", "statement": "Ah Chwee lived next door in the line house.", "quote": "Next door stay Ah Chwee, we two go to the river every day."}, {"source": "ent_mother", "target": "ent_ed2c08a37f39", "statement": "Her mother cooked salted fish fried rice a few times a week.", "quote": "My mother cook salted fish fried rice, few times a week."}, {"source": "ent_724ab7832635", "target": "ent_sungai_siput", "statement": "Ah Chwee still lives in Sungai Siput.", "quote": "Still there, still in Sungai Siput."}, {"source": "ent_father", "target": "ent_bb10decc7f23", "statement": "Her father owned and opened a coffee shop on Jalan Bandar in Ipoh in 1958, which closed in 1969.", "quote": "Later he saved a bit of money, nineteen fifty-eight he opened a coffee shop in Ipoh, at Jalan Bandar."}, {"source": "ent_father", "target": "ent_97e177fdd6c1", "statement": "Her father made bread toasted over a charcoal fire and spread with butter at the coffee shop.", "quote": "My father toast the bread, charcoal fire one, spread butter \u2014 that smell\u2026 now you cannot get that kind already."}, {"source": "ent_mother", "target": "ent_bb10decc7f23", "statement": "Her mother cooked at the back of the coffee shop.", "quote": "My mother cook at the back."}, {"source": "ent_husband", "target": "ent_c58ceebd0afd", "statement": "Her husband lived upstairs above the shop at Jalan Bandar after they married in 1968.", "quote": "Moved upstairs at Jalan Bandar. Above the shop. We stayed there more than ten years."}, {"source": "ent_mother", "target": "ent_ed2c08a37f39", "statement": "Her mother made salted fish fried rice with a lot of spring onion.", "quote": "My mother's salted fish fried rice. She put a lot of spring onion."}, {"source": "ent_grandfather", "target": "ent_74919e81d0c7", "statement": "Her grandfather came from Yongchun, Fujian.", "quote": "Yes, Fujian, Yongchun."}, {"source": "ent_grandfather", "target": "ent_77948984689a", "statement": "Her grandfather travelled by boat from China and landed at Penang.", "quote": "Came by boat, landed at Penang."}, {"source": "ent_father", "target": "ent_97e177fdd6c1", "statement": "Her father toasted bread over a charcoal fire at the coffee shop.", "quote": "My father still got up at five every day, start the charcoal, toast the bread \u2014 nobody eat."}], "legend": [{"colour": "#9C3B24", "label": "bread toasted on charcoal fire, father's coffee shop, salted fish fried rice\u2026"}, {"colour": "#2F5D50", "label": "upstairs, Tan Eng Huat"}, {"colour": "#7A5C2E", "label": "Fujian, Yongchun, Penang, Lim Cheong Hin"}, {"colour": "#4A5C7A", "label": "line house, Ah Chwee, Sungai Siput"}]};
  const root = document.getElementById("g18be29b0-svg");
  const tip = document.getElementById("g18be29b0-tip");
  const width = root.clientWidth || 820, height = 520;
  const svg = d3.select(root).attr("viewBox", [0, 0, width, height]);
  svg.selectAll("*").remove();

  const legend = d3.select("#g18be29b0-legend");
  data.legend.forEach(function (entry) {
    legend.append("span")
      .style("margin-right", "14px")
      .html('<span style="display:inline-block;width:9px;height:9px;border-radius:9px;'
            + 'background:' + entry.colour + ';margin-right:5px">'
            + '</span>' + entry.label);
  });

  const link = svg.append("g").selectAll("line").data(data.links).join("line")
    .attr("stroke", "#C9BCA6").attr("stroke-width", 1.6)
    .on("mouseover", function (event, d) {
      d3.select(this).attr("stroke", "#9C3B24").attr("stroke-width", 3);
      tip.innerHTML = "<b>" + d.statement + "</b><br><i>she said: &ldquo;"
                    + d.quote + "&rdquo;</i>";
    })
    .on("mouseout", function () {
      d3.select(this).attr("stroke", "#C9BCA6").attr("stroke-width", 1.6);
    });

  const node = svg.append("g").selectAll("circle").data(data.nodes).join("circle")
    .attr("r", function (d) { return 5 + Math.min(d.degree, 8) * 1.6; })
    .attr("fill", function (d) { return d.colour; })
    .attr("stroke", "#FFFCF5").attr("stroke-width", 2)
    .style("cursor", "pointer")
    .on("mouseover", function (event, d) {
      tip.innerHTML = "<b>" + d.name + "</b> &mdash; " + d.degree
                    + " connection(s)" + (d.detail ? "<br>" + d.detail : "");
    })
    .on("click", function (event, d) {
      const near = new Set([d.id]);
      data.links.forEach(function (l) {
        const a = l.source.id || l.source, b = l.target.id || l.target;
        if (a === d.id) near.add(b);
        if (b === d.id) near.add(a);
      });
      node.attr("opacity", function (n) { return near.has(n.id) ? 1 : 0.15; });
      label.attr("opacity", function (n) { return near.has(n.id) ? 1 : 0.15; });
      link.attr("opacity", function (l) {
        const a = l.source.id || l.source, b = l.target.id || l.target;
        return (a === d.id || b === d.id) ? 1 : 0.08;
      });
    })
    .call(d3.drag()
      .on("start", function (event, d) {
        if (!event.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on("drag", function (event, d) { d.fx = event.x; d.fy = event.y; })
      .on("end", function (event, d) {
        if (!event.active) sim.alphaTarget(0);
        d.fx = null; d.fy = null;
      }));

  const label = svg.append("g").selectAll("text").data(data.nodes).join("text")
    .text(function (d) { return d.name; })
    .attr("font-family", "Georgia, serif").attr("font-size", 10.5)
    .attr("fill", "#241E1A").attr("text-anchor", "middle").attr("dy", -11)
    .style("pointer-events", "none");

  svg.on("dblclick", function () {
    node.attr("opacity", 1); label.attr("opacity", 1); link.attr("opacity", 1);
    tip.innerHTML = "";
  });

  const sim = d3.forceSimulation(data.nodes)
    .force("link", d3.forceLink(data.links).id(function (d) { return d.id; })
                     .distance(95).strength(0.45))
    .force("charge", d3.forceManyBody().strength(-430))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide().radius(34))
    .on("tick", function () {
      link.attr("x1", function (d) { return d.source.x; })
          .attr("y1", function (d) { return d.source.y; })
          .attr("x2", function (d) { return d.target.x; })
          .attr("y2", function (d) { return d.target.y; });
      node.attr("cx", function (d) { return d.x; })
          .attr("cy", function (d) { return d.y; });
      label.attr("x", function (d) { return d.x; })
           .attr("y", function (d) { return d.y; });
    });
  }

  start();
})();
</script>
